services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oliveiratrust-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/upload.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=oliveiratrust
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PASSWORD=secret
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - CACHE_DRIVER=redis
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - LOG_STDERR=true
      - LOG_PROCESSING_CHANNEL=daily
      - LOG_PROCESSING_LEVEL=debug
      - LOG_PROCESSING_DAYS=7
      - LOG_PROCESSING_PATH=/var/www/html/storage/logs/processing.log
    depends_on:
      - postgres
      - redis
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:work", "--once"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:latest
    container_name: oliveiratrust-postgres
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=oliveiratrust
      - POSTGRES_USER=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: oliveiratrust-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --save 60 1 --loglevel warning --requirepass secret

  mailhog:
    image: mailhog/mailhog:latest
    container_name: oliveiratrust-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend:
    driver: bridge
